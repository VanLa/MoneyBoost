// Unity 2022.3.62f3c1：与附带 Gradle 7.5.1 配套使用 Android Gradle Plugin 7.4.2，勿在不了解 Unity/launcher 影响时单独升 AGP
allprojects {
    // play-services-measurement* 在 AGP7.4 + Unity launcher 上常出现 DexingWithClasspathTransform/mergeExtDex 失败，经验上 21.2.0 整条线最稳
    // 将 21.3+ 与 22+ 全部对齐到 21.2.0（与 firebase-analytics:21.2.2 同代）
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.google.android.gms' &&
                    details.requested.name != null && details.requested.name.startsWith('play-services-measurement') &&
                    details.requested.version != null) {
                def v = details.requested.version
                if (v.startsWith('22.')) {
                    details.useVersion '21.2.0'
                } else if (v.startsWith('21.3') || v.startsWith('21.4') || v.startsWith('21.5') || v.startsWith('21.6') || v.startsWith('21.7')) {
                    details.useVersion '21.2.0'
                } else if (v.startsWith('21.2') && v != '21.2.0') {
                    // Analytics 21.2.2 会带 measurement 21.2.2；若 dex 仍失败可强制与 21.2.0 完全一致
                    details.useVersion '21.2.0'
                }
            }
        }
    }

    buildscript {
        repositories {
            google()
            mavenCentral()
            maven { url "https://android-sdk.is.com" }
            maven { url "https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea" }
            maven { url "https://artifact.bytedance.com/repository/pangle" }
        }

        dependencies {
            // If you are changing the Android Gradle Plugin version, make sure it is compatible with the Gradle version preinstalled with Unity
            // See which Gradle version is preinstalled with Unity here https://docs.unity3d.com/Manual/android-gradle-overview.html
            // See official Gradle and Android Gradle Plugin compatibility table here https://developer.android.com/studio/releases/gradle-plugin#updating-gradle
            // To specify a custom Gradle version in Unity, go do "Preferences > External Tools", uncheck "Gradle Installed with Unity (recommended)" and specify a path to a custom Gradle version
            classpath 'com.android.tools.build:gradle:7.4.2'
            classpath 'com.google.gms:google-services:4.4.2'
            classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.9'
        }
    }

    repositories {
        google()
        mavenCentral()
        maven { url "https://android-sdk.is.com" }
        maven { url "https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea" }
        maven { url "https://artifact.bytedance.com/repository/pangle" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}