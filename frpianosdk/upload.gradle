// GMA Next-Gen：中介 adapter 的 POM 依赖 play-services-ads，必须在我们发布的 POM 上排除，
// 否则 Unity / Maven 消费者会出现 ads-mobile-sdk 与 play-services-ads-api Duplicate class
def GMA_NEXTGEN_EXCLUDES = [
        [group: 'com.google.android.gms', module: 'play-services-ads'],
        [group: 'com.google.android.gms', module: 'play-services-ads-lite'],
        [group: 'com.google.android.gms', module: 'play-services-ads-api'],
]

afterEvaluate {
    publishing {
        //发布的 jar 包配置
        publications {
            release(MavenPublication) {
                groupId = 'com.dream'
                artifactId = 'laughtale'
                version = '1.2.2.9.1'
                //aar 文件
                def projectName = project.getName()
                artifact "build/outputs/aar/${projectName}-release.aar"

                pom.withXml {
                    def dependenciesNode = asNode().appendNode("dependencies")
                    // implementation + api 都写入 POM，Maven 引用时可自动拉中介适配器等传递依赖
                    def seen = new HashSet<String>()
                    [configurations.implementation, configurations.api].each { cfg ->
                        cfg.allDependencies.forEach { Dependency dependency ->
                            if (dependency.version == "unspecified" || dependency.name == "unspecified") {
                                return
                            }
                            if (dependency.group == null || dependency.name == null) {
                                return
                            }
                            def key = "${dependency.group}:${dependency.name}:${dependency.version}"
                            if (!seen.add(key)) {
                                return
                            }
                            def dependencyNode = dependenciesNode.appendNode('dependency')
                            dependencyNode.appendNode('groupId', dependency.group)
                            dependencyNode.appendNode('artifactId', dependency.name)
                            dependencyNode.appendNode('version', dependency.version)

                            def exclusionsNode = dependencyNode.appendNode('exclusions')
                            GMA_NEXTGEN_EXCLUDES.each { ex ->
                                def exclusionNode = exclusionsNode.appendNode('exclusion')
                                exclusionNode.appendNode('groupId', ex.group)
                                exclusionNode.appendNode('artifactId', ex.module)
                            }
                        }
                    }
                }
            }
        }
        //仓库地址配置
        repositories {
            maven {
//                url NEXUS_REPOSITORY_URL
                url = "/Users/jinhaoyu/AndroidProject/LaughTaleSDK"
                allowInsecureProtocol true
            }
        }
    }
}
