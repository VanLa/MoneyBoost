apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

apply from: 'upload.gradle'

android {
    namespace 'com.joyboost.moneyboost'
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    lint {
        checkReleaseBuilds false
    }
}

// GMA Next-Gen 与旧 GMA 类冲突：中介 adapter POM 会拉 play-services-ads → play-services-ads-api
// 本模块解析时排除；发布 POM 里也必须带 exclusions（见 upload.gradle），否则 Unity 仍会 Duplicate class
configurations.configureEach {
    exclude group: 'com.google.android.gms', module: 'play-services-ads'
    exclude group: 'com.google.android.gms', module: 'play-services-ads-lite'
    exclude group: 'com.google.android.gms', module: 'play-services-ads-api'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

dependencies {
    // --- Firebase（版本对应 BoM 35.0.0；显式版本用于发布 POM）
    implementation 'com.google.firebase:firebase-analytics:24.0.0'
    implementation 'com.google.firebase:firebase-crashlytics:21.0.0'
    implementation 'com.google.firebase:firebase-crashlytics-ndk:21.0.0'
    implementation 'com.google.firebase:firebase-config:24.0.0'

    // --- 业务 / Play / 隐私
    implementation 'com.google.android.play:review:2.0.2'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    // --- GMA Next-Gen SDK（AdMob 主聚合；Google 库存内置，无需再加 google-adapter）
    // https://developers.google.com/admob/android/next-gen/quick-start
    implementation 'com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.5.0'

    // --- Meta Audience Network bidding via the AdMob Next-Gen-compatible adapter.
    // Official pairing: Next-Gen 1.5.0 + adapter 6.22.0.1 + Audience Network 6.22.0.
    // Do not add facebook-android-sdk (login/social SDK) or the legacy GMA SDK.
    // https://developers.google.com/admob/android/next-gen/mediation/meta
    implementation 'com.google.ads.mediation:facebook:6.22.0.1'
    implementation 'com.facebook.android:audience-network-sdk:6.22.0'

    // --- Google Play Billing
    implementation 'com.android.billingclient:billing:9.1.0'

    // --- AndroidX
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.annotation:annotation:1.11.0'
}
