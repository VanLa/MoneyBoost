// 构建约束：Unity 2022.3.62f3c1 配套使用 Gradle 7.5.1 + Android Gradle Plugin 7.4.x
// 已从 AppLovin MAX 切换为 GMA Next-Gen SDK（AdMob 聚合）
apply plugin: 'com.android.library'

apply from: 'upload.gradle'

android {
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    lintOptions {
        checkReleaseBuilds false
    }
}

dependencies {
    // --- Firebase
    implementation 'com.google.firebase:firebase-analytics:23.2.0'
    implementation 'com.google.firebase:firebase-crashlytics:19.3.0'
    implementation 'com.google.firebase:firebase-crashlytics-ndk:19.3.0'
    implementation 'com.google.firebase:firebase-config:22.0.1'

    // --- 业务 / Play / 隐私
    implementation 'com.aliyun.dpa:oss-android-sdk:2.9.18'
    implementation 'com.google.android.play:review:2.0.2'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    // --- GMA Next-Gen SDK（AdMob 主聚合）
    // https://developers.google.com/admob/android/next-gen/quick-start
    implementation 'com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.2.1'

    // --- AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.annotation:annotation:1.7.1'
}
