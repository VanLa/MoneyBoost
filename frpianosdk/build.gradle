// 构建约束：Unity 2022.3.62f3c1 配套使用 Gradle 7.5.1 + Android Gradle Plugin 7.4.x；请勿随意改 unityLibrary/launcher 的 Gradle 主版本
// AppLovin MAX 版本在本文件写死；minSdk 24 + AGP 7.4.2 实测可编译
apply plugin: 'com.android.library'

apply from: 'upload.gradle'

android {
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"

//        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    lintOptions {
        checkReleaseBuilds false
    }
}

dependencies {
    // --- Firebase（对齐竞品 firebase-analytics 23.2.0）
    // Crashlytics 19.3+ 的 so 仍支持 16KB 页
    implementation 'com.google.firebase:firebase-analytics:23.2.0'
    implementation 'com.google.firebase:firebase-crashlytics:19.3.0'
    implementation 'com.google.firebase:firebase-crashlytics-ndk:19.3.0'
    implementation 'com.google.firebase:firebase-config:22.0.1'

    // --- 业务 / Play / 隐私
    implementation 'com.aliyun.dpa:oss-android-sdk:2.9.18'
    implementation 'com.google.android.play:review:2.0.2'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    // --- AppLovin MAX（Gradle 7.5.1 / AGP 7.4.2 / minSdk 24）
    // facebook-adapter 6.21 在 AGP 7.4.2 mergeExtDex 失败，锁定 6.20.0.0
    implementation 'com.applovin:applovin-sdk:13.6.3'
    implementation 'com.applovin.mediation:google-ad-manager-adapter:25.4.0.0'
    implementation 'com.applovin.mediation:google-adapter:25.4.0.0'
    implementation 'com.applovin.mediation:facebook-adapter:6.20.0.0'
    implementation 'com.applovin.mediation:mintegral-adapter:17.1.61.0'
    implementation 'com.applovin.mediation:bytedance-adapter:8.1.0.4.0'
    implementation 'com.applovin.mediation:unityads-adapter:4.19.0.0'
    implementation 'com.applovin.mediation:vungle-adapter:7.7.4.0'

    // --- AndroidX（与 compileSdk 34、Java 11、minSdk 24 兼容）
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.annotation:annotation:1.7.1'

}
