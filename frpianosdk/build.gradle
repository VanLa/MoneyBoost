// 构建约束：Unity 2022.3.62f3c1 配套使用 Gradle 7.5.1 + Android Gradle Plugin 7.4.x；请勿随意改 unityLibrary/launcher 的 Gradle 主版本
// GMA Next-Gen / 中介适配器版本在本文件写死；minSdk 24 + AGP 7.4.2 实测可编译
//
apply plugin: 'com.android.library'

apply from: 'upload.gradle'

android {
    // AGP 7.4.2/AAPT2 is validated with SDK 34. SDK 35's resource table
    // cannot be read reliably by this toolchain (LoadedArsc overlap error).
    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    lintOptions {
        checkReleaseBuilds false
    }
}

// GMA Next-Gen 与旧 GMA 类冲突：中介 adapter POM 会拉 play-services-ads → play-services-ads-api
// 本模块解析时排除；发布 POM 里也必须带 exclusions（见 upload.gradle），否则 Unity 仍会 Duplicate class
configurations.configureEach {
    exclude group: 'com.google.android.gms', module: 'play-services-ads'
    exclude group: 'com.google.android.gms', module: 'play-services-ads-lite'
    exclude group: 'com.google.android.gms', module: 'play-services-ads-api'
}

dependencies {
    // --- Firebase（对齐竞品 firebase-analytics 23.2.0）
    // Crashlytics 19.3+ 的 so 仍支持 16KB 页
    implementation 'com.google.firebase:firebase-analytics:23.2.0'
    implementation 'com.google.firebase:firebase-crashlytics:19.3.0'
    implementation 'com.google.firebase:firebase-crashlytics-ndk:19.3.0'
    implementation 'com.google.firebase:firebase-config:22.0.1'

    // --- 业务 / Play / 隐私
    implementation 'com.google.android.play:review:2.0.2'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    // --- GMA Next-Gen SDK（AdMob 主聚合；Google 库存内置，无需再加 google-adapter）
    // https://developers.google.com/admob/android/next-gen/quick-start
    implementation 'com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.4.0'

    // --- AdMob mediation: Google demand plus Facebook
    implementation 'com.google.ads.mediation:facebook:6.21.0.4'

    // --- Google Play Billing
    implementation 'com.android.billingclient:billing:8.0.0'

    // --- AndroidX（与 compileSdk 34、Java 11、minSdk 24 兼容）
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.annotation:annotation:1.7.1'
}
